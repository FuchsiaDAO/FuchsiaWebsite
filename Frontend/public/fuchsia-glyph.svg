<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fuchsiaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e879f9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e879f9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fuchsiaGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e879f9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Eye of Ra/Horus Fuchsia Glyph -->
  <g fill="url(#fuchsiaGradient)" stroke="none">
    <!-- Upper eyelid curve -->
    <path d="M40 80 Q100 45 160 80 Q140 65 100 65 Q60 65 40 80 Z" stroke="url(#fuchsiaGradient)" stroke-width="4" fill="none"/>
    
    <!-- Lower eyelid curve -->
    <path d="M40 80 Q70 105 100 95 Q130 105 160 80" stroke="url(#fuchsiaGradient)" stroke-width="4" fill="none"/>
    
    <!-- Eye center (iris) -->
    <circle cx="100" cy="80" r="12" fill="url(#fuchsiaGradientDark)"/>
    
    <!-- Hexagonal pupil -->
    <polygon points="100,72 106,78 106,82 100,88 94,82 94,78" fill="url(#fuchsiaGradient)"/>
    
    <!-- Tear/marking extending down -->
    <path d="M40 80 Q35 95 30 115 Q28 125 32 135 Q38 145 45 140 Q48 135 45 125 Q42 110 40 95" stroke="url(#fuchsiaGradient)" stroke-width="4" fill="none"/>
    
    <!-- Spiral curl at bottom of tear -->
    <path d="M30 115 Q25 120 22 130 Q20 140 25 145 Q32 150 38 145 Q42 140 38 135 Q35 132 36 130 Q37 128 35 129" stroke="url(#fuchsiaGradient)" stroke-width="3" fill="none"/>
    
    <!-- Vertical line extending down from eye -->
    <rect x="98" y="140" width="4" height="35" fill="url(#fuchsiaGradient)" rx="2"/>
    
    <!-- Bottom horizontal cross element -->
    <rect x="90" y="170" width="20" height="4" fill="url(#fuchsiaGradient)" rx="2"/>
    <rect x="98" y="162" width="4" height="20" fill="url(#fuchsiaGradient)" rx="2"/>
  </g>
</svg>
